name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - run: bun install --frozen-lockfile

      # `build` is `tsc -b && vite build`, so type errors fail the deploy here.
      - run: bun run build

      # Snapshot the rendered menu into dist/index.html so crawlers that don't
      # run JavaScript still see the landing copy (scripts/prerender.mjs).
      - run: bunx playwright install --with-deps chromium
      - run: bun run prerender

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
