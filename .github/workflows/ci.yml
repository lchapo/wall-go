name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - run: bun install --frozen-lockfile

      # Lint before tests: `test:unit` writes coverage/.
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run build
